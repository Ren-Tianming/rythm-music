server {
    listen 80;
    listen [::]:80;
    server_name www.rythmmusic.site;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.rythmmusic.site;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/www.rythmmusic.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.rythmmusic.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:RyThMMusicTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 52m;
    client_body_timeout 60s;
    client_header_timeout 15s;
    keepalive_timeout 30s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 1200s;
    }
}
